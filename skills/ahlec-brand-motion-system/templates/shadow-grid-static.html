<!DOCTYPE html>

<title>Shadow Grid — frame estático</title>
<meta name="hz:slide-selector" content=".canvas-916" />
<meta name="hz:canvas-width" content="1080" />
<meta name="hz:canvas-height" content="1920" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; display:flex; justify-content:center; align-items:center; min-height:100vh; }

  .canvas-916 {
    position:relative;
    width:1080px; height:1920px;
    background:#030303;
    overflow:hidden;
  }

  /* dot-grid mesh — medido no ficheiro real: período ~17px horizontal, ~10px vertical,
     branco a ~3% opacidade sobre preto quase puro. É textura, não desenho — mal se vê de perto. */
  .mesh {
    position:absolute; inset:0;
    background-image:
      radial-gradient(rgba(255,255,255,0.05) 0.6px, transparent 0.6px);
    background-size: 17px 10px;
    background-position: 0 0;
  }

  /* vinheta pesada — o fundo original escurece bastante nas bordas */
  .vignette {
    position:absolute; inset:0;
    background: radial-gradient(120% 85% at 50% 45%, transparent 40%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;
  }

  .shard {
    position:absolute;
    width:0; height:0;
    /* triangle via border trick; size set per-shard via --s */
    border-left: calc(var(--s) * 0.58) solid transparent;
    border-right: calc(var(--s) * 0.58) solid transparent;
    border-bottom: var(--s) solid rgba(232,236,240, var(--op));
    transform: translate(-50%,-50%) rotate(var(--rot));
    filter: drop-shadow(0 0 calc(var(--s) * 0.15) rgba(255,255,255, calc(var(--op) * 0.4)));
  }
</style>
</head>
